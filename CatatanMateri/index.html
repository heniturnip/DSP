<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .biodata {
            background-color: #fff;
            max-width: 600px;
            margin: 20px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .biodata h1 {
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .biodata p {
            line-height: 1.8;
            margin: 10px 0;
        }
        .biodata img {
            border-radius: 50%;
            margin-top: 20px;
            max-width: 150px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="biodata">
        <h1>Biodata Diri</h1>
        <p><strong>Nama:</strong> Johanes Febriyanto</p>
        <p><strong>Tempat, Tanggal Lahir:</strong> Tangerang, 22 Maret 2003</p>
        <p><strong>Alamat:</strong> Perum Mustika Tigaraksa</p>
        <p><strong>Hobi:</strong> Futsal</p>
        <p><strong>Foto:</strong></p>
        <img src="foto.jpg" alt="Foto Johanes Febriyanto">
    </div>
</body>
</html>
